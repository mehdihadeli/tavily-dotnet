name: Build, test, and publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Tavily.Net.slnx

      - name: Build
        run: dotnet build Tavily.Net.slnx --configuration Release --no-restore

      - name: Test core unit project
        run: dotnet test --project tests/Tavily.Net/UnitTests/Tavily.Net.UnitTests.csproj --configuration Release --no-build

      - name: Test AI unit project
        run: dotnet test --project tests/Tavily.Net.Extensions.AI/UnitTests/Tavily.Net.Extensions.AI.UnitTests.csproj --configuration Release --no-build

      - name: Test core integration project
        if: env.TAVILY_API_KEY != ''
        run: dotnet test --project tests/Tavily.Net/IntegrationTests/Tavily.Net.IntegrationTests.csproj --configuration Release --no-build

      - name: Test AI integration project
        if: env.TAVILY_API_KEY != ''
        run: dotnet test --project tests/Tavily.Net.Extensions.AI/IntegrationTests/Tavily.Net.Extensions.AI.IntegrationTests.csproj --configuration Release --no-build

  calculate-version:
    name: Calculate release version
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      assembly_version: ${{ steps.version.outputs.assembly_version }}
      informational_version: ${{ steps.version.outputs.informational_version }}
      environment: ${{ steps.version.outputs.environment }}
      commit: ${{ steps.version.outputs.commit }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install nbgv CLI
        run: dotnet tool install --tool-path "$RUNNER_TEMP/nbgv" nbgv --version 3.10.94

      - name: Calculate version
        id: version
        shell: bash
        run: |
          NBGV="$RUNNER_TEMP/nbgv/nbgv" bash scripts/calculate-version.sh

  publish:
    name: Publish package and release
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && needs['calculate-version'].outputs.environment == 'dev')
    needs:
      - build-test
      - calculate-version
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Tavily.Net.slnx

      - name: Pack both packages
        run: |
          dotnet pack src/Tavily.Net/Tavily.Net.csproj --configuration Release --no-restore --output artifacts -p:PublicRelease=true -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -p:ReleasePackageVersion="${{ needs.calculate-version.outputs.version }}"
          dotnet pack src/Tavily.Net.Extensions.AI/Tavily.Net.Extensions.AI.csproj --configuration Release --no-restore --output artifacts -p:PublicRelease=true -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -p:ReleasePackageVersion="${{ needs.calculate-version.outputs.version }}"

      - name: Verify both package artifacts
        shell: bash
        run: |
          for package in Tavily.Net Tavily.Net.Extensions.AI; do
            test -f "artifacts/$package.${{ needs.calculate-version.outputs.version }}.nupkg"
            test -f "artifacts/$package.${{ needs.calculate-version.outputs.version }}.snupkg"
          done

      - name: Publish both packages to NuGet.org
        shell: bash
        run: |
          for package in Tavily.Net Tavily.Net.Extensions.AI; do
            dotnet nuget push "artifacts/$package.${{ needs.calculate-version.outputs.version }}.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Publish matching Release Drafter draft
        if: always()
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          version: ${{ needs.calculate-version.outputs.version }}
          name: v${{ needs.calculate-version.outputs.version }}
          tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.calculate-version.outputs.version) }}
          publish: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(needs.calculate-version.outputs.version, '-preview.') }}
          prerelease: ${{ contains(needs.calculate-version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
